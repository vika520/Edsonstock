<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EdsonStock">
  <title>EdsonStock</title>
  <!-- 深色底，与工作台侧栏 #0d1117 一致；保证浅色 / 深色标签栏都能看清 -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0d1117"/>
  <!-- logo 右侧图形之一：5 根由矮到高的空心柱，底部对齐 -->
  <g fill="none" stroke="#e8ecf3" stroke-width="2.4" stroke-linejoin="round">
    <rect x="6"  y="42" width="8" height="12"/>
    <rect x="18" y="36" width="8" height="18"/>
    <rect x="30" y="29" width="8" height="25"/>
    <rect x="42" y="22" width="8" height="32"/>
    <rect x="54" y="14" width="8" height="40"/>
  </g>
  <!-- logo 右侧图形之二：左下向右上的上升折线 + 右上箭头（金 = 工作台 accent） -->
  <g fill="none" stroke="#f0b429" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 50 L21 32 L31 38 L57 7"/>
    <path d="M44 7 H57 V20"/>
  </g>
</svg>
